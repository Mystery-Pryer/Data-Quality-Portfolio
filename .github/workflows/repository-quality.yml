name: Repository Quality

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "**/*.csv"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "requirements*.txt"
      - "scripts/validate_repository.py"
      - ".github/workflows/repository-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    uses: Mystery-Pryer/repo-automation/.github/workflows/repository-quality.yml@v1
    with:
      python-version: "3.12"
      validator-path: scripts/validate_repository.py
      install-requirements: true
      artifact-name: repository-quality-report
      artifact-path: artifacts/repository-quality-summary.json
      retention-days: 14
