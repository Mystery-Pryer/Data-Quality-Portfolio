name: Repository Quality

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "**/*.csv"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "requirements*.txt"
      - "scripts/validate_repository.py"
      - ".github/workflows/repository-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root dependencies when declared
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Validate tracked source, SQL, CSV and documentation files
        run: python scripts/validate_repository.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-quality-report
          path: artifacts/repository-quality-summary.json
          if-no-files-found: warn
          retention-days: 14
